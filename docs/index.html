<title>Listas de alabanza</title>
<script>
  // Tema antes de pintar (sin parpadeo): «auto» sigue al teléfono; también claro u oscuro fijo.
  (function () { var t = 'auto'; try { t = localStorage.getItem('listas-tema') || 'auto'; } catch (e) {}
    var dark = t === 'oscuro' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light'; })();
</script>
<style>
  :root {
    --font: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    --navy: #0b2a6b; --navy2: #12204a; --blue: #1f6fd1; --blue2: #2a8fe0; --cyan: #36d1e6;
    --green: #17b26a; --orange: #f08c00; --red: #e5484d;
    --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
    --nav-h: calc(80px + var(--safe-b));
    /* Tema claro */
    --bg: #e9f0fa;
    --blob1: rgba(54, 209, 230, .35); --blob2: rgba(31, 111, 209, .28); --blob3: rgba(120, 90, 255, .16);
    --glass: rgba(255, 255, 255, .62); --glass2: rgba(255, 255, 255, .84); --glass-line: rgba(255, 255, 255, .85);
    --field: rgba(236, 242, 251, .85); --field-focus: rgba(255, 255, 255, .95); --chip: rgba(228, 236, 248, .9);
    --title: #0b2a6b; --text: #14213d; --muted: #6f7c98; --faint: #9aa6bd; --line: rgba(20, 40, 90, .08);
    --sky: rgba(31, 111, 209, .1); --sky-text: #1f6fd1;
    --shadow: 0 8px 26px rgba(16, 42, 107, .10); --shadow2: 0 14px 34px rgba(16, 42, 107, .22);
  }
  [data-theme="dark"] {
    --bg: #060a16;
    --blob1: rgba(54, 209, 230, .16); --blob2: rgba(31, 111, 209, .22); --blob3: rgba(120, 90, 255, .14);
    --glass: rgba(26, 34, 60, .55); --glass2: rgba(18, 25, 46, .82); --glass-line: rgba(255, 255, 255, .08);
    --field: rgba(255, 255, 255, .07); --field-focus: rgba(255, 255, 255, .1); --chip: rgba(255, 255, 255, .08);
    --title: #eaf1ff; --text: #e3e9f6; --muted: #8f9bb8; --faint: #66728f; --line: rgba(255, 255, 255, .07);
    --sky: rgba(54, 209, 230, .14); --sky-text: #6fe3f2;
    --shadow: 0 8px 26px rgba(0, 0, 0, .35); --shadow2: 0 14px 34px rgba(0, 0, 0, .5);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; color: var(--text); font: 14.5px/1.45 var(--font); }
  html { background: var(--bg); }
  /* Fondo con luces suaves detrás del vidrio */
  body { min-height: 100vh; overscroll-behavior-y: contain; background:
    radial-gradient(60vmax 50vmax at 10% 30%, var(--blob1), transparent 60%),
    radial-gradient(55vmax 45vmax at 95% 60%, var(--blob2), transparent 60%),
    radial-gradient(50vmax 40vmax at 40% 105%, var(--blob3), transparent 60%), var(--bg); background-attachment: fixed; }
  button { font: inherit; color: inherit; cursor: pointer; }
  /* 16 px en los campos: así el iPhone no hace zoom al escribir */
  input, textarea, select { font: 16px/1.4 var(--font); color: var(--text); background: var(--field); border: 1.5px solid transparent; border-radius: 14px; padding: 12px 14px; outline: none; width: 100%; max-width: 100%; display: block; }
  input:focus, textarea:focus, select:focus { border-color: var(--blue2); background: var(--field-focus); }
  /* La fecha del iPhone trae su propio ancho y centrado: se ajusta al cuadro */
  input[type=date] { -webkit-appearance: none; appearance: none; min-height: 48px; text-align: left; color-scheme: light dark; }
  input[type=date]::-webkit-date-and-time-value { text-align: left; }
  select { -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
  /* Al cambiar claro/oscuro: un círculo que se abre desde el botón (si el teléfono lo admite) */
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  /* Más lento y suave: arranca despacio, se abre y frena al final; la vista vieja se atenúa un poco */
  ::view-transition-new(root) { animation: reveal 1.15s cubic-bezier(.65,.05,.25,1) both; }
  ::view-transition-old(root) { animation: dimOld 1.15s cubic-bezier(.65,.05,.25,1) both; }
  @keyframes reveal { from { clip-path: circle(0 at var(--tx, 50%) var(--ty, 50%)); } to { clip-path: circle(160vmax at var(--tx, 50%) var(--ty, 50%)); } }
  @keyframes dimOld { to { filter: brightness(.82) blur(1px); } }
  html.theming, html.theming * { transition: background-color .9s ease, color .9s ease, border-color .9s ease, box-shadow .9s ease !important; }
  textarea { resize: vertical; min-height: 110px; line-height: 1.5; }
  .wrap { max-width: 520px; margin: 0 auto; }
  .glass { background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%); border: 1px solid var(--glass-line); }

  /* Cabecera con mosaico geométrico */
  .hero { position: relative; height: calc(140px + var(--safe-t)); background: var(--navy) var(--mosaic) 0 0 / 176px 176px repeat; }
  .hero.tall { height: calc(190px + var(--safe-t)); }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(6,10,22,.35)); pointer-events: none; }
  .hero .tools { position: absolute; left: 0; right: 0; top: calc(var(--safe-t) + 14px); display: flex; align-items: center; justify-content: space-between; padding: 0 18px; z-index: 2; }
  .round { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.25); background: rgba(18, 32, 74, .72); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: #fff; display: grid; place-items: center; font-size: 18px; font-weight: 700; box-shadow: 0 6px 16px rgba(0,0,0,.25); }
  .round.ghost { visibility: hidden; }
  .pill-logo { background: rgba(255,255,255,.9); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border: 0; border-radius: 99px; padding: 8px 18px; font-weight: 800; letter-spacing: .14em; font-size: 12px; color: #0b2a6b; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
  .pill-logo span { color: var(--blue2); }
  /* Encabezado «ALABANZA»: el logo de fondo y la palabra que aparece letra por letra y cada
     tanto se funde y se vuelve a formar. */
  .hero .tools { display: grid; grid-template-columns: 1fr auto 1fr; }
  .hero .tools > :first-child { justify-self: start; }
  .hero .tools > :last-child { justify-self: end; }
  .pill-logo.al { position: relative; overflow: hidden; display: grid; place-items: center; height: 46px; min-width: 168px; padding: 0 20px; background: linear-gradient(135deg, rgba(11,42,107,.88), rgba(29,111,138,.88) 55%, rgba(65,172,164,.9)); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.3); color: #fff; font-size: 18px; letter-spacing: .13em; box-shadow: 0 6px 18px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.25); }
  .pill-logo.al .al-word { color: #fff; }
  /* El logo de la iglesia, grande, sobre el mosaico de la cabecera */
  .hero-logo { position: absolute; inset: 0 0 32px; overflow: hidden; pointer-events: none; z-index: 1; }
  .hero { height: calc(178px + var(--safe-t)); }
  .hero.tall { height: calc(220px + var(--safe-t)); }
  .hl-art { position: absolute; left: 50%; top: calc(var(--safe-t) + 106px); width: 135px; height: 108px; transform: translate(-50%, -50%); }
  body.demo .hl-art { top: calc(var(--safe-t) + 128px); }
  .hl-art::before { content: ""; position: absolute; inset: 0 8%; border-radius: 50%; background: radial-gradient(closest-side, rgba(6,14,36,.82), rgba(6,14,36,.5) 65%, transparent); inset: -6% -2%; }
  .hl-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: .95; filter: drop-shadow(0 0 8px rgba(65,172,164,.55)); }
  .hero-logo .s { transform-origin: 53% 73%; animation: alSun 6s ease-in-out infinite; }
  .hero-logo .a { transform-origin: 60% 62%; animation: alGlide 5s ease-in-out infinite; }
  @keyframes alSun { 50% { opacity: 1; transform: scale(1.05); } }
  @keyframes alGlide { 50% { transform: translate(3px, -4px) rotate(-4deg); } }
  .hero.tall .hl-art { width: 180px; height: 144px; top: calc(var(--safe-t) + 120px); }
  body.demo .hero.tall .hl-art { top: calc(var(--safe-t) + 140px); }
  .al-word { position: relative; display: inline-flex; perspective: 300px; text-shadow: 0 1px 8px rgba(0,0,0,.45), 0 0 14px rgba(65,172,164,.55); animation: alMorph 9s ease-in-out var(--ph, 0s) infinite; }
  .al-word i { font-style: normal; display: inline-block; }
  .al-word.reveal i { animation: alIn .8s cubic-bezier(.2,.8,.2,1) calc(var(--i) * 75ms + .15s) both; }
  @keyframes alIn { from { opacity: 0; transform: translateY(70%) rotateX(-85deg); filter: blur(6px); } 60% { filter: blur(0); } }
  @keyframes alMorph {
    0%, 78%, 100% { filter: blur(0); letter-spacing: 0; opacity: 1; transform: none; }
    84% { filter: blur(5px); letter-spacing: .32em; opacity: .25; transform: scaleY(.8); }
    90% { filter: blur(1.5px); letter-spacing: -.06em; opacity: .9; transform: scaleY(1.06); }
  }
  /* «‹ Seguir editando / viendo»: vuelve a la última lista abierta. */
  .resume-chip { display: inline-flex; align-items: center; gap: 6px; height: 42px; max-width: 100%; padding: 0 12px 0 8px; border-radius: 21px; border: 1px solid rgba(255,255,255,.3); background: rgba(65,172,164,.82); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: #fff; box-shadow: 0 6px 16px rgba(0,0,0,.25); text-align: left; animation: chipIn .5s cubic-bezier(.2,1.35,.4,1) both; }
  .resume-chip i { font-style: normal; font-size: 20px; font-weight: 800; line-height: 1; }
  .resume-chip span { display: flex; flex-direction: column; font-size: 10.5px; line-height: 1.15; font-weight: 600; opacity: .95; }
  .resume-chip b { font-size: 12.5px; font-weight: 800; }
  @keyframes chipIn { from { opacity: 0; transform: translateX(-14px) scale(.9); } }
  /* Moderador viendo la app como otro rol */
  #viewAsBar { position: fixed; left: 50%; bottom: calc(var(--nav-h, 64px) + var(--safe-b, 0px) + 14px); transform: translateX(-50%); z-index: 70; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border-radius: 99px; background: rgba(11,42,107,.92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: #fff; font-size: 12px; white-space: nowrap; max-width: calc(100% - 24px); box-shadow: 0 8px 24px rgba(0,0,0,.3); animation: barIn .45s var(--ease, ease) both; }
  @keyframes barIn { from { opacity: 0; transform: translate(-50%, 14px); } }
  #viewAsBar button { border: 0; border-radius: 99px; padding: 7px 12px; background: #41aca4; color: #fff; font-weight: 800; font-size: 12px; }
  @media (prefers-reduced-motion: reduce) { .al-word, .al-word i, .hl-art img { animation: none !important; } }
  .hero h1 { position: absolute; left: 22px; right: 22px; bottom: 44px; margin: 0; color: #fff; font-size: 23px; font-weight: 800; text-shadow: 0 2px 12px rgba(0,0,0,.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 2; }
  .sheetbody { position: relative; margin-top: -32px; border-radius: 30px 30px 0 0; min-height: calc(100vh - 108px); padding: 22px 18px calc(var(--nav-h) + 40px);
    background: var(--glass2); -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%); border-top: 1px solid var(--glass-line); }
  .avatar-float { position: absolute; right: 22px; top: -22px; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--glass-line); background: var(--glass2); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: var(--sky-text); display: grid; place-items: center; font-weight: 800; box-shadow: var(--shadow); }

  .hello { color: var(--muted); font-weight: 500; }
  .big { font-size: 26px; font-weight: 800; color: var(--title); margin: 0 0 14px; letter-spacing: -.01em; line-height: 1.15; }
  .search { display: flex; align-items: center; gap: 10px; background: var(--field); border-radius: 99px; padding: 4px 6px 4px 16px; border: 1px solid var(--glass-line); }
  .search input { background: none; border: 0; padding: 10px 0; }
  .sec { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 12px; }
  .sec h3 { margin: 0; font-size: 16px; font-weight: 700; color: var(--title); }
  .sec .link { border: 0; background: none; color: var(--muted); font-size: 12.5px; font-weight: 600; }
  .hscroll { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 10px 18px 12px; margin: 0 -18px; scrollbar-width: none; }
  .hscroll::-webkit-scrollbar { display: none; }

  /* Barra de abajo: las 4 opciones siempre a la mano */
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; height: var(--nav-h); padding: 8px 10px var(--safe-b); display: flex; justify-content: center;
    background: var(--glass2); -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%); border-top: 1px solid var(--glass-line); box-shadow: 0 -10px 30px rgba(10, 20, 50, .12); }
  .tabbar .in { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; max-width: 520px; }
  .tabbar button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .tabbar i { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-style: normal; font-size: 19px; color: #fff; box-shadow: var(--shadow); transition: transform .15s; }
  .tabbar button.on { color: var(--title); }
  .tabbar button.on i { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(31,111,209,.35); }
  .q1 { background: linear-gradient(145deg, #4fe0f0, #24b9d6); } .q2 { background: linear-gradient(145deg, #3a8cf0, #1f6fd1); } .q3 { background: linear-gradient(145deg, #2b4fae, #1b3c8f); } .q4 { background: linear-gradient(145deg, #1f2f63, #12204a); }

  /* Tarjetas de fechas (pantalla 1) */
  .date-card { flex: 0 0 164px; scroll-snap-align: start; border: 1px solid var(--glass-line); text-align: left; background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-radius: 22px; padding: 8px; box-shadow: var(--shadow); position: relative; }
  .date-card .img { height: 140px; border-radius: 17px; background: var(--navy) var(--mosaic) center / 132px repeat; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; }
  .date-card .img::before { content: ""; position: absolute; inset: 0; background: linear-gradient(160deg, rgba(11,42,107,.55), rgba(31,111,209,.35)); }
  .date-card .img b { position: relative; font-size: 42px; font-weight: 800; line-height: 1; text-shadow: 0 3px 14px rgba(0,0,0,.35); }
  .date-card .img span { position: relative; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .date-card .edit { position: absolute; right: 14px; top: 14px; width: 30px; height: 30px; border-radius: 9px; background: rgba(255,255,255,.92); color: #0b2a6b; font-size: 13px; z-index: 2; display: grid; place-items: center; }
  .date-card h4 { margin: 10px 6px 0; font-size: 14px; color: var(--title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .date-card small { display: block; margin: 0 6px 6px; color: var(--faint); font-size: 11.5px; }
  .status { display: inline-block; border-radius: 99px; padding: 2px 9px; font-size: 10.5px; font-weight: 700; }
  .status.borrador { background: var(--chip); color: var(--muted); }
  .status.revision { background: rgba(240,140,0,.15); color: var(--orange); }
  .status.listo { background: rgba(23,178,106,.15); color: var(--green); }
  .date-row { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: var(--glass); border: 1px solid var(--glass-line); margin-bottom: 10px; width: 100%; text-align: left; }
  .date-row .d { width: 50px; height: 50px; border-radius: 15px; background: linear-gradient(145deg, #3a8cf0, #1f6fd1); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; line-height: 1; flex: none; }
  .date-row .d small { font-size: 10px; letter-spacing: .1em; }
  .date-row .t { flex: 1; min-width: 0; }
  .date-row .t b { display: block; color: var(--title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .date-row .t small { color: var(--muted); }

  /* Pantalla 2: detalle arriba + carrusel de alabanzas abajo */
  .modes { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .mode { border: 0; border-radius: 99px; padding: 6px 12px; font-size: 12px; font-weight: 700; background: var(--chip); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .mode::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 2px solid currentColor; }
  .mode.on { background: rgba(54,209,230,.18); color: #0aa3c2; }
  [data-theme="dark"] .mode.on { color: #6fe3f2; }
  .mode.on::before { background: currentColor; }
  .mode.plain::before { display: none; }
  .field { background: var(--glass); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid var(--glass-line); border-radius: 18px; box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 12px; }
  .field .lab { font-size: 11.5px; color: var(--faint); font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .song-head { display: flex; align-items: center; gap: 12px; }
  .song-head .num { width: 44px; height: 44px; border-radius: 14px; background: linear-gradient(135deg, var(--blue), var(--cyan)); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 17px; flex: none; }
  .song-head b { display: block; font-size: 17px; color: var(--title); line-height: 1.2; }
  .song-head small { color: var(--muted); }
  .video { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 14px; overflow: hidden; background: #000; }
  .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .keys { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .keys button { border: 0; background: var(--chip); border-radius: 11px; padding: 9px 0; font-weight: 700; color: var(--title); }
  .keys button.on { background: var(--blue); color: #fff; box-shadow: 0 6px 14px rgba(31,111,209,.35); }
  .keyline { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .comment { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .comment:last-child { border-bottom: 0; }
  .comment { transition: opacity .2s, transform .2s; }
  .comment.leaving { opacity: .25; transform: translateX(30px); }
  .comment b { color: var(--title); font-size: 13px; }
  .comment small { color: var(--faint); font-size: 11px; }
  .comment p { margin: 2px 0 0; }
  .send { display: flex; gap: 8px; margin-top: 8px; }
  .send input { border-radius: 99px; }
  .send button { border: 0; border-radius: 99px; background: var(--blue); color: #fff; font-weight: 700; padding: 0 16px; white-space: nowrap; }
  /* Carrusel: compacto y con espacio arriba para que la tarjeta elegida no se corte */
  .songs-car { position: fixed; left: 0; right: 0; bottom: var(--nav-h); z-index: 15; padding: 6px 0 2px; background: linear-gradient(transparent, var(--bg) 40%); }
  [data-theme="light"] .songs-car { background: linear-gradient(rgba(233,240,250,0), rgba(233,240,250,.95) 40%); }
  .songs-car .sec { margin: 0 0 0; padding: 0 18px; }
  .songs-car .hscroll { margin: 0; padding: 12px 18px 10px; }
  .song-card { flex: 0 0 112px; scroll-snap-align: start; border: 0; border-radius: 18px; padding: 10px; color: #fff; text-align: left; position: relative; box-shadow: var(--shadow2); min-height: 92px; display: flex; flex-direction: column; gap: 4px; transition: transform .2s, box-shadow .2s; }
  .song-card:nth-child(3n+1) { background: linear-gradient(150deg, #1f8fe0, #1a6fc9); }
  .song-card:nth-child(3n+2) { background: linear-gradient(150deg, #24479c, #182f74); }
  .song-card:nth-child(3n) { background: linear-gradient(150deg, #1aa2c9, #1679b8); }
  .song-card.sel { transform: translateY(-5px); box-shadow: 0 0 0 3px var(--cyan), var(--shadow2); }
  .song-card .top { display: flex; align-items: center; justify-content: space-between; }
  .song-card .ic { width: 24px; height: 24px; border-radius: 8px; background: rgba(255,255,255,.95); color: var(--blue); display: grid; place-items: center; font-weight: 800; font-size: 12px; }
  .song-card .k { font-size: 15px; font-weight: 800; }
  .song-card b { font-size: 12.5px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .song-card small { font-size: 10px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: auto; }
  .song-card.add { background: var(--glass); color: var(--sky-text); border: 2px dashed rgba(31,111,209,.4); box-shadow: none; align-items: center; justify-content: center; font-weight: 700; font-size: 12.5px; text-align: center; }
  .reorder { display: flex; gap: 8px; margin-bottom: 12px; }
  .reorder button { flex: 1; border: 0; border-radius: 12px; padding: 9px; background: var(--chip); font-weight: 700; color: var(--title); font-size: 13px; }

  /* Crear lista en pasos */
  .steps { display: flex; gap: 6px; margin-bottom: 14px; }
  .steps span { flex: 1; height: 5px; border-radius: 3px; background: var(--chip); }
  .steps span.on { background: linear-gradient(90deg, var(--blue), var(--cyan)); }
  .pick { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: var(--glass); border: 1px solid var(--glass-line); margin-bottom: 8px; }
  .pick .t { flex: 1; min-width: 0; }
  .pick .t b { display: block; color: var(--title); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pick .t small { color: var(--muted); }
  .pm { width: 40px; height: 40px; border-radius: 50%; border: 0; font-size: 22px; font-weight: 700; line-height: 1; flex: none; display: grid; place-items: center; }
  .pm.add { background: var(--blue); color: #fff; box-shadow: 0 6px 14px rgba(31,111,209,.35); }
  .pm.rem { background: rgba(229,72,77,.14); color: var(--red); }
  .order-btns { display: flex; flex-direction: column; gap: 4px; flex: none; }
  .order-btns button { width: 34px; height: 26px; border: 0; border-radius: 8px; background: var(--chip); color: var(--title); font-weight: 800; font-size: 12px; }
  .mine-num { width: 30px; height: 30px; border-radius: 10px; background: linear-gradient(135deg, var(--blue), var(--cyan)); color: #fff; display: grid; place-items: center; font-weight: 800; flex: none; font-size: 13px; }
  .next-bar { position: fixed; left: 0; right: 0; bottom: var(--nav-h); z-index: 18; padding: 10px 18px; display: flex; justify-content: center; }
  .next-bar .btn { max-width: 484px; }

  /* Pantalla 3: cantos como boletos */
  .tabs { display: flex; background: var(--chip); border-radius: 99px; padding: 4px; gap: 4px; margin-bottom: 16px; }
  .tabs button { flex: 1; border: 0; background: none; border-radius: 99px; padding: 9px 8px; font-weight: 700; color: var(--muted); font-size: 13px; }
  .tabs button.on { background: var(--glass2); color: var(--title); box-shadow: var(--shadow); }
  .ticket { position: relative; background: linear-gradient(140deg, #1f4aa8, #142f78); border-radius: 22px; color: #fff; margin-bottom: 14px; box-shadow: var(--shadow2); overflow: hidden; }
  .ticket.sug { background: linear-gradient(140deg, #1aa2c9, #1f6fd1); }
  .ticket::before, .ticket::after { content: ""; position: absolute; top: 58%; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); transform: translateY(-50%); }
  .ticket::before { left: -11px; } .ticket::after { right: -11px; }
  .ticket .top { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px 12px; }
  .ticket .badge { background: var(--cyan); color: #0b2a6b; font-weight: 800; border-radius: 12px; padding: 8px 10px; text-align: center; min-width: 56px; line-height: 1.1; flex: none; transform: rotate(-4deg); box-shadow: 0 6px 14px rgba(0,0,0,.2); }
  .ticket .badge small { display: block; font-size: 9.5px; letter-spacing: .08em; }
  .ticket .badge b { font-size: 19px; }
  .ticket .top .t { flex: 1; min-width: 0; }
  .ticket .top .t b { display: block; font-size: 17px; line-height: 1.2; }
  .ticket .top .t small { opacity: .8; }
  .ticket .dash { border-top: 2px dashed rgba(255,255,255,.28); margin: 0 18px; }
  .ticket .bottom { display: flex; align-items: center; gap: 10px; padding: 12px 18px 14px; }
  .ticket .bottom .ico { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; flex: none; }
  .ticket .bottom .grow { font-size: 12.5px; opacity: .9; }
  .ticket .bottom button { border: 0; border-radius: 99px; background: #fff; color: #0b2a6b; font-weight: 700; padding: 8px 14px; font-size: 12.5px; }
  .ticket .bottom button.ghost { background: rgba(255,255,255,.16); color: #fff; }
  .get { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 12px); z-index: 20; border: 0; border-radius: 99px; background: var(--navy2); color: #fff; font-weight: 800; padding: 14px 30px; font-size: 15px; box-shadow: 0 12px 30px rgba(18,32,74,.45); white-space: nowrap; }
  [data-theme="dark"] .get { background: linear-gradient(145deg, #3a8cf0, #1f6fd1); }

  /* Comunes */
  .btn { border: 0; border-radius: 99px; padding: 14px 18px; font-weight: 700; background: var(--blue); color: #fff; width: 100%; font-size: 15px; box-shadow: 0 10px 22px rgba(31,111,209,.3); }
  .btn.dark { background: var(--navy2); box-shadow: 0 10px 22px rgba(18,32,74,.3); }
  [data-theme="dark"] .btn.dark { background: #22305e; }
  .btn.ghost { background: var(--chip); color: var(--title); box-shadow: none; }
  .btn.green { background: var(--green); box-shadow: 0 10px 22px rgba(23,178,106,.3); }
  .btn.red { background: rgba(229,72,77,.12); color: var(--red); box-shadow: none; }
  .btn:disabled { opacity: .5; }
  label.btn { display: block; cursor: pointer; text-align: center; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }
  .empty { text-align: center; color: var(--muted); padding: 22px 10px; }
  .lyrics { white-space: pre-line; line-height: 1.6; }
  .chart { white-space: pre; overflow-x: auto; font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--field); border-radius: 12px; padding: 12px; }
  .files { display: flex; gap: 8px; flex-wrap: wrap; }
  .file { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--sky); color: var(--sky-text); border-radius: 12px; padding: 8px 11px; font-weight: 600; font-size: 12.5px; max-width: 100%; }
  .file span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
  .file i { font-style: normal; color: var(--faint); margin-left: 2px; }
  .sheet-bg { position: fixed; inset: 0; z-index: 40; background: rgba(6,12,30,.45); display: none; align-items: flex-end; justify-content: center; }
  .sheet-bg.open { display: flex; }
  .sheet { width: 100%; max-width: 520px; max-height: 92vh; overflow: auto; border-radius: 28px 28px 0 0; padding: 12px 20px calc(var(--safe-b) + 20px); display: flex; flex-direction: column; gap: 10px; animation: up .25s ease-out;
    background: var(--glass2); -webkit-backdrop-filter: blur(26px) saturate(160%); backdrop-filter: blur(26px) saturate(160%); border-top: 1px solid var(--glass-line); }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet h2 { margin: 4px 0; font-size: 19px; color: var(--title); }
  .grab { width: 42px; height: 5px; border-radius: 3px; background: var(--chip); margin: 0 auto 6px; }
  label.l { font-size: 12px; font-weight: 600; color: var(--muted); margin: 4px 2px -4px; display: block; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 14px); transform: translateX(-50%); z-index: 60; background: rgba(18,32,74,.92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: #fff; padding: 11px 18px; border-radius: 16px; font-weight: 600; box-shadow: var(--shadow2); opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90vw; text-align: center; font-size: 13.5px; }
  .toast.on { opacity: 1; }
  .banner { position: fixed; left: 0; right: 0; top: 0; z-index: 30; padding: calc(var(--safe-t) + 3px) 12px 3px; background: var(--orange); color: #fff; font-size: 10.5px; font-weight: 700; text-align: center; letter-spacing: .02em; }
  body.demo .hero .tools { top: calc(var(--safe-t) + 30px); }
  body.demo .hero { height: calc(200px + var(--safe-t)); }
  body.demo .hero.tall { height: calc(244px + var(--safe-t)); }
  /* Campana de avisos */
  .bell { position: relative; }
  .bell b { position: absolute; top: -4px; right: -4px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 99px; background: var(--red); color: #fff; font-size: 11px; font-weight: 800; display: grid; place-items: center; box-shadow: 0 0 0 2px rgba(11,42,107,.9); }
  .notif { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: 16px; background: var(--glass); border: 1px solid var(--glass-line); margin-bottom: 8px; width: 100%; text-align: left; }
  .notif.new { box-shadow: inset 3px 0 0 var(--cyan), var(--shadow); }
  .notif .ic { width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(145deg, #3a8cf0, #1f6fd1); color: #fff; display: grid; place-items: center; flex: none; font-size: 17px; }
  .notif .t { flex: 1; min-width: 0; }
  .notif .t b { display: block; color: var(--title); font-size: 14px; }
  .notif .t small { color: var(--muted); }
  .notif { cursor: pointer; transition: transform .22s ease-in, opacity .22s; }
  .notif.leaving { animation: none !important; transform: translateX(70px); opacity: 0; }
  .nt-del { flex: none; align-self: center; width: 32px; height: 32px; border-radius: 10px; border: 0; background: var(--chip); color: var(--muted); font-size: 14px; font-weight: 800; }
  .status.enviada { background: rgba(23,178,106,.15); color: var(--green); }
  .status.prep { background: rgba(240,140,0,.15); color: var(--orange); }
  .member { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .member .av { width: 42px; height: 42px; border-radius: 50%; background: var(--sky); color: var(--sky-text); display: grid; place-items: center; font-weight: 800; flex: none; }
  .member select { width: auto; padding: 8px 10px; font-size: 13px; }
  .login-wrap { min-height: 100vh; display: flex; flex-direction: column; }
  .login-wrap .sheetbody { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-bottom: calc(var(--safe-b) + 30px); }
  .err { color: var(--red); font-size: 13px; min-height: 1em; }
  .link { border: 0; background: none; color: var(--sky-text); font-weight: 600; padding: 4px; }
  .center { text-align: center; }
  .hint { background: var(--field); border-radius: 14px; padding: 12px 14px; font-size: 13px; color: var(--muted); }
  .hint b { color: var(--title); }

  /* ===================== Movimiento ===================== */
  :root { --spring: cubic-bezier(.2, 1.35, .4, 1); --ease: cubic-bezier(.2, .8, .2, 1); }

  /* --- Bienvenida (splash) --- */
  #splash { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: #0b2a6b var(--mosaic, none) 0 0 / 176px 176px repeat; transition: opacity .6s var(--ease), visibility .6s; }
  #splash::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(6,14,36,.62), rgba(6,10,22,.92) 70%); }
  #splash .sp-in { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  /* Logo de la iglesia: el sol aparece girando y el águila llega volando; luego planea */
  #splash { background: #091f1d radial-gradient(circle at 50% 42%, #14423c 0%, #091f1d 72%) !important; }
  #splash::before { display: none; }
  #splash .sp-mark { position: relative; width: 190px; height: 152px; margin-bottom: 6px; }
  #splash .sp-mark img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #splash .sp-mark .ms { animation: spSun 1s cubic-bezier(.2,.8,.2,1) both, spGlow 3s ease-in-out 1s infinite; transform-origin: 53% 73%; }
  #splash .sp-mark .ma { transform-origin: 60% 62%; animation: spFly 1.2s cubic-bezier(.16,1,.3,1) .25s both, spGlide 4s ease-in-out 1.5s infinite; }
  @keyframes spSun { from { opacity: 0; transform: scale(.6) rotate(-35deg); } }
  @keyframes spGlow { 50% { filter: drop-shadow(0 0 10px rgba(120,230,215,.9)); transform: scale(1.04); } }
  @keyframes spFly { 0% { opacity: 0; transform: translate(-110px, 90px) scale(.55) rotate(-18deg); } 60% { opacity: 1; transform: translate(5px, -6px) scale(1.03) rotate(3deg); } 100% { transform: none; } }
  @keyframes spGlide { 0%, 100% { transform: none; } 30% { transform: translate(2px, -6px) rotate(-6deg); } 70% { transform: translate(-2px, 2px) rotate(3deg); } }
  #splash .sp-logo { animation-delay: .9s !important; }
  #splash .sp-ring { position: absolute; top: 50%; left: 50%; width: 130px; height: 130px; margin: -98px 0 0 -65px; border-radius: 50%; border: 2px solid rgba(54,209,230,.55); animation: spRing 2s var(--ease) infinite; }
  #splash .sp-ring.b { animation-delay: .7s; }
  #splash .sp-logo { position: relative; background: #fff; color: #0b2a6b; border-radius: 99px; padding: 14px 30px; font: 800 20px/1 var(--font); letter-spacing: .2em; box-shadow: 0 18px 50px rgba(0,0,0,.45), 0 0 0 8px rgba(255,255,255,.08); animation: spLogo .9s var(--spring) both; }
  #splash .sp-logo span { color: #2a8fe0; display: inline-block; animation: spT 1.6s ease-in-out .8s infinite; }
  #splash .sp-sub { color: rgba(255,255,255,.85); font: 600 13px var(--font); letter-spacing: .08em; animation: fadeUp .7s var(--ease) .35s both; }
  #splash .sp-notes { position: relative; height: 22px; display: flex; gap: 10px; color: #6fe3f2; font-size: 16px; }
  #splash .sp-notes i { font-style: normal; animation: note 1.2s ease-in-out infinite; }
  #splash .sp-notes i:nth-child(2) { animation-delay: .15s; } #splash .sp-notes i:nth-child(3) { animation-delay: .3s; }
  #splash .sp-bar { width: 130px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; animation: fadeUp .6s var(--ease) .5s both; }
  #splash .sp-bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #36d1e6, #2a8fe0); animation: bar 1.1s ease-in-out infinite; }
  #splash.out { opacity: 0; visibility: hidden; }
  #splash.out .sp-logo { transform: scale(1.25); transition: transform .6s var(--ease); }
  @keyframes spLogo { from { transform: scale(.4) rotate(-8deg); opacity: 0; } }
  @keyframes spRing { from { transform: scale(.6); opacity: .9; } to { transform: scale(2.1); opacity: 0; } }
  @keyframes spT { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes note { 0%, 100% { transform: translateY(0); opacity: .45; } 50% { transform: translateY(-7px); opacity: 1; } }
  @keyframes bar { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } }

  /* --- Cargando: tarjetas fantasma que brillan y círculo girando --- */
  .skel { pointer-events: none; }
  .skel .img, .skel i, .skel .d, .skel .av { display: block; background: var(--chip); position: relative; overflow: hidden; }
  .skel i { height: 12px; border-radius: 6px; margin: 10px 6px 0; }
  .skel i.s { width: 55%; height: 10px; margin-top: 8px; }
  .date-row.skel .t i { margin: 4px 0; } .member.skel .grow i { margin: 4px 0; }
  .skel .img::after, .skel i::after, .skel .d::after, .skel .av::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); animation: shimmer 1.3s infinite; }
  [data-theme="dark"] .skel .img::after, [data-theme="dark"] .skel i::after, [data-theme="dark"] .skel .d::after, [data-theme="dark"] .skel .av::after { background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent); }
  .date-card.skel .img { background: var(--chip); }
  .date-card.skel .img::before { display: none; }
  @keyframes shimmer { to { transform: translateX(100%); } }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--chip); border-top-color: var(--blue2); animation: spin .8s linear infinite; margin: 30px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  button.loading { position: relative; color: transparent !important; pointer-events: none; }
  button.loading::after { content: ""; position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .7s linear infinite; }
  .btn.ghost.loading::after, .btn.red.loading::after { border-color: var(--chip); border-top-color: var(--blue2); }

  /* --- Transiciones de navegación --- */
  #view.nav-fwd .sheetbody { animation: inRight .46s var(--ease) both; }
  #view.nav-back .sheetbody { animation: inLeft .46s var(--ease) both; }
  #view.nav-tab .sheetbody { animation: inUp .42s var(--ease) both; }
  #view[class*="nav-"] .sheetbody > * { animation: fadeUp .5s var(--ease) both; }
  #view[class*="nav-"] .sheetbody > :nth-child(2) { animation-delay: .04s; } #view[class*="nav-"] .sheetbody > :nth-child(3) { animation-delay: .08s; }
  #view[class*="nav-"] .sheetbody > :nth-child(4) { animation-delay: .12s; } #view[class*="nav-"] .sheetbody > :nth-child(5) { animation-delay: .16s; }
  #view[class*="nav-"] .sheetbody > :nth-child(6) { animation-delay: .2s; } #view[class*="nav-"] .sheetbody > :nth-child(n+7) { animation-delay: .24s; }
  #view[class*="nav-"] .hero h1 { animation: titleIn .55s var(--ease) both; }
  #view.nav-fwd .songs-car, #view.nav-fwd .next-bar, #view.nav-tab .songs-car { animation: inBottom .5s var(--ease) .1s both; }
  #view[class*="nav-"] .get { animation: getIn .55s var(--spring) .15s both; }
  @keyframes inRight { from { transform: translateX(42px); opacity: 0; } }
  @keyframes inLeft { from { transform: translateX(-42px); opacity: 0; } }
  @keyframes inUp { from { transform: translateY(26px); opacity: 0; } }
  @keyframes inBottom { from { transform: translateY(60px); opacity: 0; } }
  @keyframes titleIn { from { transform: translateY(10px); opacity: 0; letter-spacing: .04em; } }
  @keyframes getIn { from { transform: translate(-50%, 40px) scale(.8); opacity: 0; } }
  /* Deslizar desde el borde: la flecha que aparece */
  .edge-hint { position: fixed; left: 0; top: 50%; z-index: 90; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--blue); color: #fff; font-size: 24px; font-weight: 800; box-shadow: var(--shadow2); opacity: 0; transform: translate(-50px, -50%); pointer-events: none; transition: opacity .2s, transform .25s var(--ease); }

  /* --- Hojas: suben con rebote y bajan al cerrar --- */
  .sheet-bg.open { animation: bgIn .3s ease both; }
  .sheet { animation: sheetUp .5s var(--spring) both; touch-action: pan-y; }
  .sheet-bg.closing { animation: bgOut .28s ease both; }
  .sheet-bg.closing .sheet { animation: sheetDown .28s cubic-bezier(.4,0,1,1) both; }
  .grab { cursor: grab; height: 5px; position: relative; }
  .grab::after { content: ""; position: absolute; inset: -14px -40px; }
  @keyframes bgIn { from { background: rgba(6,12,30,0); } }
  @keyframes bgOut { to { background: rgba(6,12,30,0); } }
  @keyframes sheetUp { from { transform: translateY(100%); } }
  @keyframes sheetDown { to { transform: translateY(105%); } }
  .sheet > * { animation: fadeUp .45s var(--ease) both; }
  .sheet > :nth-child(3) { animation-delay: .04s; } .sheet > :nth-child(4) { animation-delay: .07s; } .sheet > :nth-child(5) { animation-delay: .1s; } .sheet > :nth-child(n+6) { animation-delay: .13s; }

  /* --- Microinteracciones --- */
  button, .date-card, .song-card, .pick, .notif, .member.tap { transition: scale .18s var(--spring), background-color .2s, color .2s, box-shadow .2s, transform .25s var(--spring); }
  button:active, .member.tap:active { scale: .95; }
  .btn:active, .date-row:active, .notif:active, .pick:active { scale: .975; }
  .btn, .get, .send button, .date-row, .notif, .pick, .member.tap, .ticket .bottom button { position: relative; overflow: hidden; }
  .ripple { position: absolute; border-radius: 50%; background: currentColor; opacity: .22; transform: scale(0); animation: ripple .6s ease-out forwards; pointer-events: none; }
  .btn .ripple, .get .ripple, .send button .ripple { background: #fff; opacity: .35; }
  @keyframes ripple { to { transform: scale(1); opacity: 0; } }
  .shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-7px); } 40%, 60% { transform: translateX(7px); } }
  /* Pestañas con píldora deslizante */
  .tabs.has-ind { position: relative; }
  .tabs .ind { position: absolute; left: 4px; top: 4px; bottom: 4px; border-radius: 99px; background: var(--glass2); box-shadow: var(--shadow); transition: transform .42s var(--spring), width .42s var(--spring), opacity .2s; z-index: 0; pointer-events: none; }
  .tabs.has-ind button { position: relative; z-index: 1; transition: color .3s; }
  .tabs.has-ind button.on { background: none; box-shadow: none; }
  /* Barra de abajo: el ícono rebota */
  .tabbar i.bounce { animation: tabBounce .5s var(--spring); }
  @keyframes tabBounce { 30% { transform: translateY(-7px) scale(1.12); } 60% { transform: translateY(-2px) scale(.96); } }
  .tabbar button i { transition: transform .35s var(--spring), box-shadow .3s; }
  .tabbar button span, .tabbar button { transition: color .3s; }
  /* Interruptor animado */
  .switch { width: 50px; height: 30px; border-radius: 99px; background: var(--chip); position: relative; flex: none; transition: background .35s; box-shadow: inset 0 1px 3px rgba(0,0,0,.15); }
  .switch i { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); transition: transform .4s var(--spring), width .2s; }
  .switch.on { background: linear-gradient(90deg, var(--blue), var(--cyan)); }
  .switch.on i { transform: translateX(20px); }
  .date-row:active .switch i { width: 28px; }
  .date-row:active .switch.on i { transform: translateX(16px); }
  /* Tonos: el elegido «salta» */
  .keys button { transition: background .2s, color .2s, box-shadow .2s, scale .18s var(--spring); }
  .keys button.on { animation: pop .4s var(--spring); }
  .mode.on { animation: pop .35s var(--spring); }
  @keyframes pop { 0% { transform: scale(.82); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
  /* Elegir cantos: aparece, cambia ＋ por −, y se va deslizando */
  .pick.pop { animation: pickIn .5s var(--spring); }
  @keyframes pickIn { from { transform: translateX(-24px) scale(.96); opacity: 0; background: var(--sky); } }
  .pick.leaving { transition: transform .22s ease-in, opacity .22s; transform: translateX(60px); opacity: 0; }
  .pm.morph { animation: morph .45s var(--spring); }
  @keyframes morph { from { transform: rotate(-180deg) scale(.5); } }
  .send button.spin, #nuGen.spin { animation: spinOnce .5s var(--ease); }
  @keyframes spinOnce { from { transform: rotate(-360deg); } }
  /* Fechas y equipo: entran en cascada */
  .date-card.enter, .member.enter { animation: cardIn .55s var(--spring) both; animation-delay: calc(var(--i, 0) * 60ms); }
  @keyframes cardIn { from { transform: translateY(18px) scale(.94); opacity: 0; } }
  .date-card:active { scale: .97; }
  .member .chev { color: var(--faint); font-size: 20px; margin-left: 4px; }
  .member.tap { border-radius: 14px; padding-left: 6px; padding-right: 6px; margin: 0 -6px; cursor: pointer; }
  .status.role-moderador { background: rgba(31,111,209,.14); color: var(--sky-text); }
  .status.role-colaborador { background: rgba(23,178,106,.15); color: var(--green); }
  .status.role-participante { background: var(--chip); color: var(--muted); }
  .status.role-pendiente { background: rgba(240,140,0,.15); color: var(--orange); }
  /* Carrusel: la elegida sube con resorte */
  .song-card { transition: transform .4s var(--spring), box-shadow .3s, scale .18s var(--spring); }
  /* Detalle de la alabanza: entra desde el lado hacia donde vas */
  #svDetail { will-change: transform; }
  #svDetail.in-next { animation: inRight .4s var(--ease) both; }
  #svDetail.in-prev { animation: inLeft .4s var(--ease) both; }
  #svDetail.in-pop { animation: inUp .4s var(--ease) both; }
  /* Avisos nuevos: entran y el borde brilla */
  .notif.new { animation: cardIn .5s var(--spring) both; }
  .notif.new .ic { animation: icGlow 2s ease-in-out 2; }
  @keyframes icGlow { 50% { box-shadow: 0 0 0 6px rgba(54,209,230,.25); } }
  /* Aviso pequeño (toast): sube con rebote */
  .toast { transform: translate(-50%, 20px) scale(.96); transition: opacity .25s, transform .45s var(--spring); }
  .toast.on { transform: translate(-50%, 0) scale(1); }
  /* Campana: se mece si hay avisos sin ver; con uno nuevo suena y lanza una onda */
  .bell .bi { display: inline-block; transform-origin: 50% 8%; }
  .bell.has .bi { animation: bellIdle 3.2s ease-in-out infinite; }
  .bell.ring .bi { animation: bellRing 1.1s ease-in-out; }
  .bell.ring::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--cyan); animation: bellWave 1s ease-out 2; pointer-events: none; }
  .bell b { animation: pop .45s var(--spring); }
  .bell.has b { animation: pop .45s var(--spring), badgePulse 2s ease-in-out .5s infinite; }
  @keyframes bellIdle { 0%, 72%, 100% { transform: rotate(0); } 76% { transform: rotate(16deg); } 80% { transform: rotate(-14deg); } 84% { transform: rotate(10deg); } 88% { transform: rotate(-6deg); } 92% { transform: rotate(3deg); } }
  @keyframes bellRing { 0%, 100% { transform: rotate(0); } 10% { transform: rotate(28deg); } 20% { transform: rotate(-26deg); } 30% { transform: rotate(22deg); } 40% { transform: rotate(-18deg); } 50% { transform: rotate(12deg); } 60% { transform: rotate(-8deg); } 70% { transform: rotate(4deg); } }
  @keyframes bellWave { from { transform: scale(1); opacity: .9; } to { transform: scale(1.9); opacity: 0; } }
  @keyframes badgePulse { 0%, 100% { box-shadow: 0 0 0 2px rgba(11,42,107,.9), 0 0 0 2px rgba(229,72,77,.5); } 50% { box-shadow: 0 0 0 2px rgba(11,42,107,.9), 0 0 0 7px rgba(229,72,77,0); } }
  /* Celebración: palomita que se dibuja y confeti */
  .celebrate { position: fixed; inset: 0; z-index: 120; display: grid; place-items: center; background: rgba(6,12,30,.35); animation: bgIn .25s ease both; pointer-events: none; transition: opacity .4s; }
  .celebrate.out { opacity: 0; }
  .celebrate .cel-in { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--glass2); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border: 1px solid var(--glass-line); padding: 26px 34px; border-radius: 28px; box-shadow: var(--shadow2); animation: celIn .55s var(--spring) both; }
  .celebrate svg { width: 80px; height: 80px; }
  .celebrate circle { fill: none; stroke: var(--green); stroke-width: 5; stroke-dasharray: 214; stroke-dashoffset: 214; animation: draw .5s var(--ease) .1s forwards; transform: rotate(-90deg); transform-box: fill-box; transform-origin: center; }
  .celebrate path { fill: none; stroke: var(--green); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .35s var(--ease) .5s forwards; }
  .celebrate b { color: var(--title); font-size: 17px; }
  .cel-burst { position: absolute; left: 50%; top: 66px; }
  .cel-burst i { position: absolute; width: 9px; height: 9px; border-radius: 3px; background: var(--c); opacity: 0; animation: burst .9s var(--ease) calc(.45s + var(--d)) forwards; }
  @keyframes celIn { from { transform: scale(.6); opacity: 0; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes burst { 0% { transform: translate(0, 0) scale(.4) rotate(0); opacity: 1; } 100% { transform: translate(var(--x), var(--y)) scale(1) rotate(260deg); opacity: 0; } }
  /* Pasos de «Nueva lista»: la barra se llena */
  #view[class*="nav-"] .steps span.on:last-of-type, #view[class*="nav-"] .steps span.on:has(+ span:not(.on)) { transform-origin: left; animation: fill .7s var(--ease) .2s both; }
  @keyframes fill { from { transform: scaleX(0); } }
  input, textarea, select { transition: border-color .25s, background-color .25s, box-shadow .25s; }
  input:focus, textarea:focus, select:focus { box-shadow: 0 0 0 4px rgba(42,143,224,.15); }

  /* --- Lista / Chart / Letra --- */
  .tabs.view-sel { margin: 0 0 12px; }
  /* Lista en cascada: cada alabanza se despliega con todo lo suyo */
  .sv-list { display: flex; flex-direction: column; gap: 10px; }
  .sv-item { border-radius: 18px; background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--shadow); overflow: hidden; scroll-margin-top: 12px; transition: box-shadow .25s; }
  .sv-item.open { box-shadow: 0 0 0 2px var(--cyan), var(--shadow2); }
  .sv-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; background: none; text-align: left; }
  .sv-num { width: 34px; height: 34px; border-radius: 11px; flex: none; display: grid; place-items: center; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--blue), var(--cyan)); }
  .sv-t { flex: 1; min-width: 0; }
  .sv-t b { display: block; color: var(--title); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sv-t small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sv-tag { display: inline-block; margin-top: 4px; font-size: 11.5px; color: var(--sky-text); background: var(--sky); border-radius: 8px; padding: 2px 8px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sv-key { flex: none; min-width: 38px; text-align: center; font-weight: 800; font-size: 15px; padding: 6px 8px; border-radius: 10px; background: var(--chip); color: var(--title); }
  .sv-chev { flex: none; color: var(--faint); font-size: 22px; transition: transform .5s var(--ease), color .4s; }
  .sv-body.sliding, .sv-body.closing { animation: none; }
  .sv-body.closing { pointer-events: none; }
  .sv-item { transition: box-shadow .45s; }
  .sv-item.open .sv-chev { transform: rotate(90deg); color: var(--sky-text); }
  .sv-body { padding: 0 12px 12px; animation: svOpen .35s var(--ease) both; }
  .sv-body .field { background: var(--glass2); }
  @keyframes svOpen { from { opacity: 0; transform: translateY(-6px); } }
  /* Lector en modo «Letra» */
  .cr-letra .cr-song { padding: 14px 16px calc(var(--safe-b) + 20px); }
  .cr-letra .cr-sec { padding: 6px 0 14px; }
  .cr-letra .cr-lyr { font-size: var(--lyr, 20px); line-height: 1.5; margin: 8px 0 0; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.05); border-left: 4px solid var(--k, var(--blue2)); white-space: pre-line; color: #fff; }
  .cr-size { flex: none; border: 0; border-radius: 10px; padding: 8px 10px; background: rgba(255,255,255,.12); color: #fff; font-weight: 800; font-size: 13px; }
  /* --- Lector «Solo chart» a pantalla completa --- */
  .cr { position: fixed; inset: 0; z-index: 160; display: flex; flex-direction: column; background: #0b0e17; color: #e9eef8; opacity: 0; transform: scale(.98); transition: opacity .25s, transform .3s var(--ease); }
  .cr.open { opacity: 1; transform: none; }
  .cr-top { display: flex; align-items: center; gap: 10px; padding: calc(var(--safe-t) + 8px) 12px 8px; background: rgba(255,255,255,.04); border-bottom: 1px solid rgba(255,255,255,.08); flex: none; }
  .cr-back { border: 0; border-radius: 99px; padding: 9px 14px; background: rgba(255,255,255,.12); color: #fff; font-weight: 700; font-size: 14px; flex: none; }
  .cr-title { flex: 1; min-width: 0; }
  .cr-title b { display: block; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cr-title small { display: block; font-size: 11.5px; color: #9aa6bd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cr-key { flex: none; font-weight: 800; font-size: 15px; padding: 6px 11px; border-radius: 10px; background: var(--blue); color: #fff; }
  .cr-stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .cr-song { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 8px calc(var(--safe-b) + 14px); display: none; touch-action: pan-y pinch-zoom; }
  .cr-song.on { display: block; }
  .cr-song.in-r { animation: crInR .28s var(--ease); }
  .cr-song.in-l { animation: crInL .28s var(--ease); }
  @keyframes crInR { from { transform: translateX(40px); opacity: .3; } }
  @keyframes crInL { from { transform: translateX(-40px); opacity: .3; } }
  .cr-file { position: relative; min-height: 120px; margin-bottom: 10px; }
  .cr-page { display: block; width: 100%; height: auto; border-radius: 8px; background: #fff; margin: 0 auto 10px; }
  .cr-chart { white-space: pre; overflow-x: auto; font: 15px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: rgba(255,255,255,.06); border-radius: 12px; padding: 14px; margin: 0 0 10px; color: #fff; }
  .cr-msg { color: #9aa6bd; font-size: 13.5px; text-align: center; padding: 14px 10px; }
  .cr-msg b { color: #fff; }
  .cr-retry { margin-top: 10px; border: 0; border-radius: 99px; padding: 10px 18px; background: var(--blue); color: #fff; font-weight: 700; font-size: 14px; }
  .cr-sec { padding: 8px 4px 12px; }
  .cr-lyr { white-space: pre-line; font-size: 18px; line-height: 1.55; margin-top: 6px; }
  .cr-loading { position: absolute; inset: 0; display: grid; place-items: center; min-height: 120px; }
  .cr-loading i { width: 30px; height: 30px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: #36d1e6; animation: spin .8s linear infinite; }
  .cr-nav { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px calc(var(--safe-b) + 8px); background: rgba(255,255,255,.04); border-top: 1px solid rgba(255,255,255,.08); }
  .cr-nav > button { flex: none; width: 44px; height: 44px; border-radius: 14px; border: 0; background: rgba(255,255,255,.12); color: #fff; font-size: 22px; font-weight: 800; }
  .cr-nav > button:disabled { opacity: .3; }
  /* Zoom: .cr-zoom crece a lo ancho y todo lo de adentro (fotos, PDF, acordes) crece con él;
     los márgenes van en em para que las marcas no se corran. */
  .cr-zoom { position: relative; width: calc(100% * var(--z, 1)); font-size: calc(16px * var(--z, 1)); transform-origin: 0 0; }
  .cr-zoom.pinch { will-change: transform; }
  .cr-zoom .cr-file { margin-bottom: .6em; min-height: 7.5em; }
  .cr-zoom .cr-page { margin: 0 auto .6em; border-radius: .5em; }
  .cr-zoom .cr-chart { font-size: .94em; padding: .9em; margin: 0 0 .6em; border-radius: .75em; }
  .cr-zoom .cr-msg { font-size: .85em; padding: .9em .6em; }
  .cr-zoom .cr-sec { padding: .5em .25em .75em; }
  .cr-zoom .cr-lyr { font-size: 1.12em; margin-top: .4em; }
  .cr-song { touch-action: pan-x pan-y; overscroll-behavior: contain; }
  .cr-song.zoomed { overflow-x: auto; }
  .cr-zoomreset { position: absolute; right: 12px; bottom: 12px; z-index: 5; border: 0; border-radius: 99px; padding: 9px 14px; background: rgba(20,28,48,.85); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); color: #fff; font-weight: 800; font-size: 13px; box-shadow: 0 6px 16px rgba(0,0,0,.4); animation: fadeUp .3s var(--ease) both; }
  /* Marcas y notas encima del documento */
  .cr-ink { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .cr-notes { position: absolute; inset: 0; pointer-events: none; }
  .cr-note { position: absolute; transform: translate(-6px, -50%); max-width: 70%; padding: .25em .55em; border-radius: .45em; background: #fff8c5; color: #1b1b1b; border-left: .25em solid var(--nc); font: 700 .8em/1.3 var(--font); white-space: pre-wrap; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
  .cr.inking .cr-ink, .cr.inking .cr-note { pointer-events: auto; }
  .cr.inking .cr-ink { touch-action: none; cursor: crosshair; }
  .cr.inking .cr-song { touch-action: none; }
  .cr.inking .cr-stage { box-shadow: inset 0 0 0 3px rgba(54,209,230,.55); }
  .cr-inkbtn { flex: none; position: relative; border: 0; border-radius: 10px; padding: 7px 10px; background: rgba(255,255,255,.12); font-size: 16px; }
  .cr-inkbtn.has::after { content: ""; position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; box-shadow: 0 0 0 2px #0b0e17; }
  .cr.inking .cr-inkbtn { background: #36d1e6; }
  .cr-tools { flex: none; display: flex; align-items: center; gap: 5px; padding: 8px 10px; overflow-x: auto; scrollbar-width: none; background: #141a2b; border-top: 1px solid rgba(255,255,255,.1); animation: inBottom .3s var(--ease) both; }
  .cr-tools::-webkit-scrollbar { display: none; }
  .cr-tools button { flex: none; min-width: 38px; height: 40px; border-radius: 12px; border: 2px solid transparent; background: rgba(255,255,255,.1); color: #fff; font-size: 17px; display: grid; place-items: center; }
  .cr-tools button i { display: block; width: 18px; height: 18px; border-radius: 50%; }
  .cr-tools button.on { border-color: #36d1e6; background: rgba(54,209,230,.2); }
  .cr-tools .done { margin-left: auto; padding: 0 12px; background: #36d1e6; color: #06202a; font-weight: 800; font-size: 18px; }
  .cr-strip { flex: 1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; justify-content: safe center; }
  .cr-strip::-webkit-scrollbar { display: none; }
  .cr-strip button { flex: none; min-width: 38px; height: 38px; border-radius: 12px; border: 0; background: rgba(255,255,255,.08); color: #cfd8ea; font-weight: 800; transition: background .2s, transform .2s var(--spring); }
  .cr-strip button.on { background: var(--blue); color: #fff; transform: scale(1.08); }

  /* --- Deslizar hacia abajo para actualizar --- */
  .ptr { position: fixed; left: 50%; top: calc(var(--safe-t) + 6px); z-index: 80; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--glass2); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border: 1px solid var(--glass-line); color: var(--sky-text); font-size: 20px; font-weight: 800; box-shadow: var(--shadow2); opacity: 0; transform: translate(-50%, 0); transition: transform .35s var(--spring), opacity .25s; pointer-events: none; }
  .ptr.ready { color: #fff; background: var(--blue); }
  .ptr.spin i { display: none; }
  .ptr.spin::after { content: ""; width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid var(--chip); border-top-color: var(--blue2); animation: spin .7s linear infinite; }
  .ptr.spin { opacity: 1 !important; }

  /* --- Campo + botón en una fila (el botón ya no se sale) --- */
  .send input { flex: 1 1 auto; min-width: 0; width: auto; }
  .send button { flex: none; min-width: 84px; }
  /* --- Inicio: nueva lista y continuar --- */
  .new-pill { border: 0; border-radius: 99px; padding: 8px 14px; font-weight: 700; font-size: 12.5px; color: #fff; background: linear-gradient(135deg, var(--blue), var(--cyan)); box-shadow: 0 6px 16px rgba(31,111,209,.3); }
  .draft-card { width: 100%; display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 12px 14px; border-radius: 18px; border: 1px solid rgba(240,140,0,.35); background: linear-gradient(135deg, rgba(240,140,0,.14), rgba(240,140,0,.05)); text-align: left; animation: cardIn .55s var(--spring) both; }
  .draft-card .ic { width: 40px; height: 40px; border-radius: 13px; background: var(--orange); color: #fff; display: grid; place-items: center; font-size: 18px; flex: none; animation: nudge 2.6s ease-in-out 1s infinite; }
  .draft-card .t { flex: 1; min-width: 0; }
  .draft-card .t b { display: block; color: var(--title); }
  .draft-card .t small { color: var(--muted); }
  .draft-card .go { font-size: 24px; color: var(--orange); }
  @keyframes nudge { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-12deg); } 90% { transform: rotate(10deg); } 95% { transform: rotate(-4deg); } }
  /* --- Lista: eliminar --- */
  .mode.danger { color: var(--red); background: rgba(229,72,77,.12); }
  .del-ic { width: 64px; height: 64px; margin: 4px auto 0; border-radius: 50%; background: rgba(229,72,77,.14); display: grid; place-items: center; font-size: 28px; animation: pop .5s var(--spring); }
  /* --- Cantos: enlace con el Temporizador, botones, partes --- */
  .link-note { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); margin: -6px 2px 12px; }
  .link-note b { color: var(--title); }
  .link-note .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--faint); }
  .link-note.ok .dot, .link-note.nube .dot { background: var(--green); box-shadow: 0 0 0 0 rgba(23,178,106,.5); animation: live 2s infinite; }
  .link-note.off .dot { background: var(--orange); }
  .link-note.buscando .dot { background: var(--blue2); animation: blink 1s infinite; }
  @keyframes live { 70% { box-shadow: 0 0 0 7px rgba(23,178,106,0); } 100% { box-shadow: 0 0 0 0 rgba(23,178,106,0); } }
  @keyframes blink { 50% { opacity: .3; } }
  .ticket.ador { background: linear-gradient(140deg, #5b3fb8, #2c2a7a); }
  .ticket.ador.sug { background: linear-gradient(140deg, #8a5cf0, #4b3fb8); }
  .tab-n { opacity: .65; font-weight: 600; }
  .tabs.cat-pick { margin-bottom: 2px; }
  .ticket.enter { animation: cardIn .55s var(--spring) both; animation-delay: calc(var(--i, 0) * 50ms); }
  .ticket .bottom { flex-wrap: nowrap; }
  .ticket .bottom .grow { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ticket .bottom button { flex: none; padding: 8px 12px; }
  .tk-edit { border: 0; width: 34px; height: 34px; border-radius: 11px; background: rgba(255,255,255,.16); color: #fff; flex: none; font-size: 14px; }
  .sec-chip { display: inline-block; border-radius: 99px; padding: 3px 11px; font-size: 11.5px; font-weight: 800; letter-spacing: .02em; color: #fff; background: var(--blue); }
  /* Mismos colores que las partes en Letras del Temporizador */
  .k-intro { --k: #8e8e93; } .k-verso { --k: #63c58e; } .k-precoro { --k: #fabb7c; } .k-coro { --k: #f4a259; } .k-puente { --k: #ec6f73; } .k-final { --k: #8e8e93; } .k-otro { --k: #0a84ff; }
  /* Referencia: video o audio nuestro */
  .tabs.ref-tabs { margin: 2px 0 10px; }
  .tabs.ref-tabs button { font-size: 12.5px; padding: 8px 6px; }
  #dtRefAudio audio, #dtAudioPlay audio { width: 100%; margin: 4px 0; }
  .audio-acts { display: flex; gap: 8px; margin-top: 8px; }
  .audio-acts .btn { padding: 11px 10px; font-size: 14px; }
  .btn.rec { background: rgba(229,72,77,.18); color: var(--red); animation: recPulse 1.2s ease-in-out infinite; }
  @keyframes recPulse { 50% { box-shadow: 0 0 0 6px rgba(229,72,77,.18); } }
  .emo-bar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
  .emo-bar button { border: 1px solid var(--glass-line); background: var(--chip); border-radius: 12px; width: 42px; height: 38px; font-size: 20px; line-height: 1; }
  .split-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .split-row select { width: auto; padding: 8px 32px 8px 12px; font-size: 14px; }
  .sec-chip[class*="k-"] { background: var(--k); }
  .sec-block { padding: 10px 2px 12px; border-bottom: 1px solid var(--line); animation: fadeUp .45s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
  .sec-block:last-child { border-bottom: 0; }
  .sec-block .lyrics { margin-top: 6px; font-size: 15.5px; }
  /* Letra: cada diapositiva en su tarjeta, con el color de su parte */
  .sec-block { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .slide-card { align-self: stretch; white-space: pre-line; font-size: 15.5px; line-height: 1.5; color: var(--text); background: var(--field); border-radius: 14px; padding: 10px 14px; border-left: 4px solid var(--k, var(--blue2)); }
  .k-otro.slide-card { --k: var(--blue2); }
  /* Hoja: que quepa en el iPhone aunque esté la barra de Safari (dvh = alto visible) */
  .sheet { max-height: calc(100vh - 24px); max-height: calc(100dvh - 24px); padding-bottom: calc(var(--safe-b) + 28px); overscroll-behavior: contain; }
  /* Sin esto, con mucho contenido los botones se aplastaban para caber (se veían cortados) */
  .sheet > * { flex-shrink: 0; }
  .swap { animation: fadeUp .35s var(--ease); }
  .sec-edit { border-radius: 16px; background: var(--field); border-left: 4px solid var(--k, var(--blue)); padding: 8px 10px 10px; margin-bottom: 8px; }
  .sec-edit.pop { animation: pickIn .5s var(--spring); }
  .sec-edit.leaving { transition: transform .2s ease-in, opacity .2s; transform: translateX(60px); opacity: 0; }
  .sec-edit .sec-top { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .sec-edit .sec-top button { border: 0; width: 30px; height: 28px; border-radius: 9px; background: var(--chip); color: var(--title); font-size: 11px; font-weight: 800; }
  .sec-edit .sec-top button:disabled { opacity: .35; }
  .sec-edit textarea { min-height: 70px; background: var(--field-focus); }
  .sec-add { display: flex; flex-wrap: wrap; gap: 6px; }
  .sec-add button { border: 0; border-radius: 99px; padding: 8px 12px; font-weight: 700; font-size: 12.5px; color: var(--k); background: var(--chip); border: 1.5px solid var(--k); }
  .sec-add button:active { background: var(--k); color: #fff; }
  /* --- Fotos de perfil --- */
  .av, .avatar-float, .c-av { overflow: hidden; }
  .av img, .avatar-float img, .c-av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .profile { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 4px 0 14px; }
  .profile b { color: var(--title); font-size: 18px; margin-top: 8px; }
  .photo-pick { position: relative; cursor: pointer; }
  .av.big { width: 96px; height: 96px; border-radius: 50%; font-size: 30px; display: grid; place-items: center; background: var(--sky); color: var(--sky-text); font-weight: 800; box-shadow: 0 0 0 4px var(--glass2), 0 0 0 6px rgba(54,209,230,.5), var(--shadow2); }
  .av.big.pop { animation: pop .5s var(--spring); }
  .photo-pick .cam { position: absolute; right: -2px; bottom: -2px; width: 34px; height: 34px; border-radius: 50%; background: var(--blue); display: grid; place-items: center; font-size: 15px; box-shadow: 0 4px 12px rgba(0,0,0,.25); transition: scale .2s var(--spring); }
  .photo-pick:active .cam { scale: .85; }
  .c-av { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; vertical-align: middle; margin-right: 6px; background: var(--sky); color: var(--sky-text); font-size: 10px; font-weight: 800; }

  /* ---- Modo offline ---- */
  .off-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; margin: 0 0 12px; padding: 12px 14px; border-radius: 16px; border: 1.5px dashed var(--sky-text); background: var(--sky); color: var(--sky-text); font: 800 14.5px var(--font); text-align: left; }
  .off-btn small { font-weight: 500; font-size: 12px; color: var(--muted); }
  .off-card { margin: 0 0 12px; padding: 10px 14px; border-radius: 16px; background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--shadow); }
  .off-card.on { box-shadow: inset 0 0 0 1.5px var(--green), var(--shadow); }
  .off-card.on b { color: var(--green); }
  .off-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .off-row span { font-size: 12.5px; color: var(--muted); }
  .off-bar { height: 6px; margin-top: 8px; border-radius: 6px; background: var(--chip); overflow: hidden; }
  .off-bar i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--blue), var(--cyan)); transition: width .3s; }
  /* ---- Dentro de una lista: la cabecera se encoge (la tarjeta sube y tapa el fondo) y la fecha
     toma el lugar de «ALABANZA». Al salir, la cabecera vuelve a bajar con su logo. ---- */
  :root { --hero-full: calc(178px + var(--safe-t)); --hero-mini: calc(98px + var(--safe-t)); }
  body.demo { --hero-full: calc(200px + var(--safe-t)); --hero-mini: calc(114px + var(--safe-t)); }
  @media (min-width: 700px) { :root { --hero-full: calc(200px + var(--safe-t)); } body.demo { --hero-full: calc(222px + var(--safe-t)); } }
  /* La cabecera no cambia de alto (eso se calcula en el mismo hilo que arma la lista y en el
     teléfono se saltaba): la tarjeta se desliza hacia arriba y la tapa. Deslizar y desvanecer los
     anima el teléfono aparte, así se ve suave aunque esté cargando. */
  .hero.compact + .sheetbody { margin-top: calc(var(--hero-mini) - var(--hero-full) - 32px); z-index: 3; }
  .hero.compact .hero-logo { opacity: 0; }
  .hero.compact + .sheetbody .avatar-float { display: none; }
  .ctitle { display: block; max-width: 100%; color: #fff; font: 800 19px/1.2 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 12px rgba(0,0,0,.45); }
  .hero.shrink .hero-logo { animation: logoOut .45s ease both; }
  .hero.shrink .ctitle { animation: ctIn .65s cubic-bezier(.45,.05,.25,1) both; }
  .hero.shrink .tools > .round, .hero.grow .tools > .round, .hero.grow .tools > .resume-chip { animation: none; }
  #view .hero.shrink + .sheetbody { animation: cardUp .65s cubic-bezier(.45,.05,.25,1) both; }
  .hero.grow .hero-logo { animation: logoIn .6s ease .15s both; }
  .hero.grow .pill-logo.al { animation: pillIn .55s cubic-bezier(.2,.8,.2,1) .12s both; }
  #view .hero.grow + .sheetbody { animation: cardDown .65s cubic-bezier(.45,.05,.25,1) both; }
  @keyframes logoOut { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-14px) scale(.92); } }
  @keyframes logoIn { from { opacity: 0; transform: translateY(-14px) scale(.92); } }
  @keyframes ctIn { from { opacity: 0; transform: translateY(70px) scale(1.15); } 40% { opacity: .6; } }
  @keyframes pillIn { from { opacity: 0; transform: translateY(14px) scale(.9); } }
  /* La tarjeta empieza donde estaba en Inicio y sube (o al revés al salir). */
  @keyframes cardUp { from { transform: translate3d(0, 84px, 0); } to { transform: translate3d(0, 0, 0); } }
  @keyframes cardDown { from { transform: translate3d(0, -84px, 0); } to { transform: translate3d(0, 0, 0); } }
  .brand-col { position: relative; display: grid; justify-items: center; min-width: 0; }
  .off-tag { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 7px; padding: 4px 12px; border-radius: 99px; background: rgba(229,72,77,.92); color: #fff; font: 800 11px var(--font); letter-spacing: .12em; white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.3); animation: fadeUp .4s var(--ease) both; }

  /* ---- Modo ligero (teléfonos con menos fuerza): sin cristal difuminado, sin animaciones que se
     repiten y con transiciones cortas. ---- */
  html.lite { --glass: rgba(255, 255, 255, .94); --glass2: rgba(255, 255, 255, .97); --shadow: 0 2px 8px rgba(16, 42, 107, .10); --shadow2: 0 4px 12px rgba(16, 42, 107, .18); }
  html.lite[data-theme="dark"] { --glass: rgba(26, 34, 60, .96); --glass2: rgba(18, 25, 46, .98); --shadow: 0 2px 8px rgba(0, 0, 0, .35); --shadow2: 0 4px 12px rgba(0, 0, 0, .45); }
  html.lite *, html.lite *::before, html.lite *::after { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  html.lite .al-word, html.lite .al-word i, html.lite .hl-art img, html.lite #splash .sp-mark img, html.lite #splash .sp-ring, html.lite .bell.has .bi, html.lite .bell.has b { animation: none !important; }
  html.lite .hl-art img { filter: none; }
  html.lite body { background-attachment: scroll; }
  html.lite #view[class*="nav-"] .sheetbody > *, html.lite .enter, html.lite .sec-block, html.lite .sheet > *, html.lite .src-row { animation: none !important; }
  html.lite #view.nav-fwd .sheetbody, html.lite #view.nav-back .sheetbody, html.lite #view.nav-tab .sheetbody { animation-duration: .2s !important; }
  html.lite .cr-song.in-r, html.lite .cr-song.in-l { animation: none !important; }

  /* ---- Tablets e iPad: el contenido se centra en una columna cómoda (no estirado) ---- */
  @media (min-width: 700px) {
    html, body { font-size: 15.5px; }
    .hero { height: calc(200px + var(--safe-t)); }
    body.demo .hero { height: calc(222px + var(--safe-t)); }
    .hl-art { width: 165px; height: 132px; top: calc(var(--safe-t) + 118px); }
    body.demo .hl-art { top: calc(var(--safe-t) + 138px); }
    .hero .tools { padding: 0 max(24px, calc((100% - 820px) / 2)); }
    .hero h1 { left: max(28px, calc((100% - 760px) / 2 + 22px)); font-size: 28px; }
    .sheetbody { max-width: 800px; margin-left: auto; margin-right: auto; border-radius: 30px 30px 0 0; padding-left: 30px; padding-right: 30px; }
    .hscroll { margin: 0 -30px; padding-left: 30px; padding-right: 30px; }
    .date-card { flex-basis: 190px; }
    .sheet { max-width: 640px; }
    .tabbar .in { max-width: 640px; }
    .cr-letra .cr-song { padding-left: max(16px, calc((100% - 820px) / 2)); padding-right: max(16px, calc((100% - 820px) / 2)); }
    .cr-top, .cr-nav { padding-left: max(12px, calc((100% - 900px) / 2)); padding-right: max(12px, calc((100% - 900px) / 2)); }
  }
  /* Tablet acostada / iPad grande: un poco más de ancho para la lista */
  @media (min-width: 1100px) {
    .sheetbody { max-width: 900px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
